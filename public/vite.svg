<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="brand" x1="4" y1="3" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f4a52" />
      <stop offset="0.58" stop-color="#722f37" />
      <stop offset="1" stop-color="#5b232c" />
    </linearGradient>
    <linearGradient id="rings" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.95)" />
      <stop offset="0.55" stop-color="rgba(255,248,240,0.85)" />
      <stop offset="1" stop-color="rgba(255,255,255,0.75)" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#brand)" />
  <!-- 两条同心圆（圆圈数量为 2） -->
  <circle cx="16" cy="16" r="8.5" stroke="url(#rings)" stroke-width="2.1" fill="none" />
  <circle cx="16" cy="16" r="5.0" stroke="url(#rings)" stroke-width="1.7" fill="none" />
</svg>
