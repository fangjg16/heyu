# 复制为 secret.yaml（勿提交真实密钥），或用 kubectl create secret generic
apiVersion: v1
kind: Secret
metadata:
  name: hermes-runtime
  namespace: jfo
  labels:
    app.kubernetes.io/part-of: jfo
type: Opaque
stringData:
  API_SERVER_KEY: "change-me-hermes-api-key"
  SKILLS_BRIDGE_KEY: "change-me-skills-bridge-key"
  DASHSCOPE_API_KEY: "sk-xxxxxxxx"
  # 可选：与 Hermes config 重复时以容器内 hermes config 为准
  OPENAI_API_KEY: "sk-xxxxxxxx"
