apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-gateway
  namespace: jfo
  labels:
    app.kubernetes.io/name: hermes-gateway
    app.kubernetes.io/part-of: jfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-gateway
        app.kubernetes.io/part-of: jfo
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["gateway", "run"]
          ports:
            - name: http
              containerPort: 8642
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_SKILLS_DIR
              value: /opt/data/skills
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime
                  key: API_SERVER_KEY
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-runtime
                  key: DASHSCOPE_API_KEY
                  optional: true
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  namespace: jfo
  labels:
    app.kubernetes.io/name: hermes-gateway
    app.kubernetes.io/part-of: jfo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-gateway
  ports:
    - name: http
      port: 8642
      targetPort: http
