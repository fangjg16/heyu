apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: jfo
  labels:
    app.kubernetes.io/name: hermes-data
    app.kubernetes.io/part-of: jfo
spec:
  accessModes:
    # 推荐 ACK NAS（RWX），便于 hermes-gateway 与 skills-bridge 共挂。
    # 若仅有云盘 RWO：改为 ReadWriteOnce，并为两 Deployment 加 podAffinity 绑同一节点。
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  # 按 ACK 现网填写，例如 alibaba-cloud-nas / alicloud-disk-essd
  # storageClassName: <YOUR_STORAGE_CLASS>
